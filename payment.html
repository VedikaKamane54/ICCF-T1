<!DOCTYPE html>
<html>
<head>
  <title>Payment</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>

<body class="bg-light">

<div class="container mt-5">
  <div class="card p-4 shadow">

    <h3>Registration Fee: ₹99</h3>

    <form action="/pay" method="POST">
      <input class="form-control mt-3" name="card" placeholder="Card Number" required>
      <input class="form-control mt-3" name="cvv" placeholder="CVV" required>

      <button class="btn btn-danger mt-3">Pay Now</button>
    </form>

  </div>
</div>

</body>
</html>
