<!DOCTYPE html>
<html>
<head>
  <title>Security Verification</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">

  <style>
    body {
      background-color: #f3f6f8;
      font-family: Arial, sans-serif;
    }
    .otp-card {
      width: 350px;
      margin: 100px auto;
      padding: 30px;
      background: white;
      border-radius: 8px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
      text-align: center;
    }
    .logo {
      font-size: 28px;
      font-weight: bold;
      color: #0a66c2;
    }
    .otp-input {
      letter-spacing: 10px;
      text-align: center;
      font-size: 20px;
    }
  </style>
</head>

<body>

<div class="otp-card">
  <div class="logo">in</div>

  <h5 class="mt-3">Security Verification</h5>
  <p class="text-muted">Enter the 6-digit code sent to your email</p>

  <form action="/otp" method="POST">
    <input type="text" name="otp" maxlength="6" class="form-control otp-input mt-3" placeholder="------" required>

    <button class="btn btn-primary w-100 mt-3">Verify</button>
  </form>

  <p class="mt-3 text-muted" style="font-size: 12px;">
    Didn’t receive code? Resend
  </p>
</div>

</body>
</html>
